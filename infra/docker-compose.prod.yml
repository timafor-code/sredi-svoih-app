name: sredi-svoih-api-production

x-api-service: &api-service
  image: "${SREDI_API_IMAGE:?Set SREDI_API_IMAGE to the approved immutable API image}"
  build:
    context: ../apps/api
    dockerfile: Dockerfile
  env_file:
    - "${API_ENV_FILE:?Set API_ENV_FILE to the owner-managed production API env file}"

services:
  api_postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: "${POSTGRES_DB:?Set POSTGRES_DB}"
      POSTGRES_USER: "${POSTGRES_USER:?Set POSTGRES_USER}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}"
    healthcheck:
      test:
        - CMD-SHELL
        - 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"'
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    restart: unless-stopped
    volumes:
      - api_postgres_data:/var/lib/postgresql/data
    networks:
      - api_database

  api_backend:
    <<: *api-service
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      api_postgres:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import urllib.request;
          urllib.request.urlopen("http://127.0.0.1:8000/health", timeout=5).read()
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    restart: unless-stopped
    networks:
      - api_database
      - api_egress

  api_migrate:
    <<: *api-service
    profiles: ["migration"]
    command: ["alembic", "upgrade", "head"]
    depends_on:
      api_postgres:
        condition: service_healthy
    restart: "no"
    networks:
      - api_database

  api_privacy_erasure_worker:
    <<: *api-service
    profiles: ["privacy-erasure"]
    command: ["python", "-m", "app.workers.privacy_erasure"]
    depends_on:
      api_postgres:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - api_database
      - api_egress

volumes:
  api_postgres_data:

networks:
  api_database:
    internal: true
  api_egress:
